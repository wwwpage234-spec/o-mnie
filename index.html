<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Web Solutions | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="blob" id="cursor-blob"></div>

<nav>
    <div class="logo">TECH.DEV</div>
    <ul>
        <li><a href="index.html">Start</a></li>
        <li><a href="oferty.html" style="color: var(--primary); font-weight: bold;">Oferty</a></li>
        <li><a href="omnie.html">O mnie</a></li>
    </ul>
</nav>

    <header id="home">
        <h1><span>Twoja Firma Zasługuje</span><br>na Nowoczesną Stronę</h1>
        <p>Tworzę cyfrowe doświadczenia, które konwertują odwiedzających w płacących klientów.</p>
        
        <div class="stats-container">
            <div class="stat-item">
                <span class="counter" data-target="120">0</span>
                <p>Zadowolonych Klientów</p>
            </div>
            <div class="stat-item">
                <span class="counter" data-target="65">0</span>
                <p>Projektów Live</p>
            </div>
            <div class="stat-item">
                <span class="counter" data-target="98">0</span>
                <p>% Satysfakcji</p>
            </div>
        </div>
        <br><br>
        <a href="index2.html" class="btn">Zacznijmy teraz</a>
    </header>

    <script>
        // LICZNIK JS
        const counters = document.querySelectorAll('.counter');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    const counter = entry.target;
                    const target = +counter.getAttribute('data-target');
                    const updateCount = () => {
                        const count = +counter.innerText;
                        const inc = target / 40;
                        if(count < target) {
                            counter.innerText = Math.ceil(count + inc);
                            setTimeout(updateCount, 30);
                        } else {
                            counter.innerText = target + "+";
                        }
                    };
                    updateCount();
                    observer.unobserve(counter);
                }
            });
        }, { threshold: 1 });

        counters.forEach(c => observer.observe(c));

        // EFEKT PODĄŻAJĄCEGO ŚWIATŁA
        const blob = document.getElementById('cursor-blob');
        document.addEventListener('mousemove', (e) => {
            blob.style.left = e.clientX - 300 + 'px';
            blob.style.top = e.clientY - 300 + 'px';
        });
    </script>
</body>
</html>
